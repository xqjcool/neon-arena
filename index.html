<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>霓虹竞技场 NEON ARENA</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#04040c;touch-action:none;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;color:#cfe;}
  #wrap{position:fixed;inset:0;overflow:hidden;}
  #game{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .layer{position:absolute;inset:0;pointer-events:none;}
  /* ---------- HUD ---------- */
  #hud{display:none;}
  #topbar{position:absolute;top:calc(10px + env(safe-area-inset-top));left:0;right:0;
    display:flex;justify-content:center;align-items:center;gap:18px;}
  #timer{font-size:26px;font-weight:800;letter-spacing:2px;color:#0ff;
    text-shadow:0 0 12px #0ff;}
  #score{font-size:20px;font-weight:700;color:#ffd23f;text-shadow:0 0 10px #fa0;}
  #hpwrap{position:absolute;top:calc(12px + env(safe-area-inset-top));left:14px;width:min(240px,34vw);}
  #hpbar{height:14px;background:rgba(255,255,255,.12);border:1px solid rgba(0,255,255,.5);
    border-radius:7px;overflow:hidden;box-shadow:0 0 10px rgba(0,255,255,.25);}
  #hpfill{height:100%;width:100%;border-radius:6px;
    background:linear-gradient(90deg,#00ff9d,#00e5ff);transition:width .15s;}
  #hptext{font-size:12px;margin-top:3px;color:#9ff;letter-spacing:1px;}
  #wpn{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;text-align:right;max-width:44vw;}
  #wpn .hbtn{margin-left:6px;margin-bottom:6px;}
  #wpnName{font-size:15px;font-weight:700;color:#0ff;text-shadow:0 0 8px #0ff;}
  #ammo{font-size:26px;font-weight:800;color:#fff;}
  #ammo.low{color:#ff4455;animation:blink .5s infinite alternate;}
  @keyframes blink{to{opacity:.45;}}
  .hbtn{pointer-events:auto;margin-top:6px;margin-left:8px;width:40px;height:40px;border-radius:50%;
    border:1px solid rgba(0,255,255,.6);background:rgba(0,40,60,.55);color:#0ff;font-size:17px;}
  .hbtn.off{color:#557; border-color:#345;}
  /* crosshair */
  #cross{position:absolute;left:50%;top:50%;--sp:7px;}
  #cross .l{position:absolute;background:#0ff;box-shadow:0 0 6px #0ff;}
  #cross .t{left:-1px;top:calc(-9px - var(--sp));width:2px;height:9px;}
  #cross .b{left:-1px;top:var(--sp);width:2px;height:9px;}
  #cross .lft{top:-1px;left:calc(-9px - var(--sp));height:2px;width:9px;}
  #cross .rgt{top:-1px;left:var(--sp);height:2px;width:9px;}
  #cross .dot{left:-1.5px;top:-1.5px;width:3px;height:3px;border-radius:50%;}
  #cross.hot .l{background:#ff3355;box-shadow:0 0 8px #ff3355;}
  #hitm{position:absolute;left:50%;top:50%;opacity:0;}
  #hitm span{position:absolute;width:2.5px;height:11px;background:#fff;box-shadow:0 0 8px #fff;}
  #hitm .a{transform:translate(-11px,-15px) rotate(45deg);}
  #hitm .b{transform:translate(9px,-15px) rotate(-45deg);}
  #hitm .c{transform:translate(-11px,4px) rotate(-45deg);}
  #hitm .d{transform:translate(9px,4px) rotate(45deg);}
  #hitm.show{opacity:1;transition:none;}
  #hitm.head span{background:#ffd23f;box-shadow:0 0 10px #ffd23f;}
  #reloadTip{position:absolute;left:50%;top:58%;transform:translateX(-50%);
    color:#ffd23f;font-size:15px;font-weight:700;display:none;text-shadow:0 0 8px #fa0;}
  #announce{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:34px;font-weight:900;
    letter-spacing:4px;color:#ffd23f;text-shadow:0 0 18px #f80,0 0 40px #f80;opacity:0;
    transform:scale(.8);transition:opacity .25s,transform .25s;}
  #announce.show{opacity:1;transform:scale(1);}
  #killfeed{position:absolute;top:calc(96px + env(safe-area-inset-top));right:14px;text-align:right;
    font-size:13px;display:flex;flex-direction:column;gap:4px;}
  #killfeed div{background:rgba(0,20,30,.6);border-right:3px solid #0ff;padding:4px 8px;border-radius:4px;}
  #killfeed div.me{border-color:#ffd23f;}
  #killfeed div.dead{border-color:#ff3355;}
  /* damage numbers */
  #dmgnums{position:absolute;inset:0;overflow:hidden;}
  .dmg{position:absolute;font-weight:900;font-size:17px;color:#fff;text-shadow:0 0 6px #0ff;
    transform:translate(-50%,-50%);will-change:transform,opacity;}
  .dmg.head{color:#ffd23f;font-size:22px;text-shadow:0 0 10px #fa0;}
  .dmg.hurt{color:#ff5566;font-size:20px;text-shadow:0 0 8px #f33;}
  /* flashes */
  #flash{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(255,20,40,.55));
    opacity:0;}
  #flashWhite{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;}
  #scope{position:absolute;inset:0;display:none;pointer-events:none;background:radial-gradient(circle at center,transparent 31vmin,#000 32vmin);}
  #scope .scopeRing{position:absolute;left:50%;top:50%;width:64vmin;height:64vmin;transform:translate(-50%,-50%);
    border:2px solid #111;border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.9), inset 0 0 40px rgba(0,0,0,.6);}
  #scope .scopeH{position:absolute;left:50%;top:50%;width:64vmin;height:2px;transform:translate(-50%,-50%);background:#111;}
  #scope .scopeV{position:absolute;left:50%;top:50%;width:2px;height:64vmin;transform:translate(-50%,-50%);background:#111;}
  #armorbar{display:none;height:8px;margin-top:4px;background:rgba(255,255,255,.12);border:1px solid rgba(68,136,255,.6);
    border-radius:4px;overflow:hidden;}
  #armorfill{height:100%;width:0%;background:linear-gradient(90deg,#4488ff,#66ccff);}
  #nadeLine{font-size:12px;color:#ffd23f;margin-top:2px;letter-spacing:1px;}
  #money{font-size:18px;font-weight:800;color:#7dff9a;text-shadow:0 0 10px #0a4;}
  #scoreboard{position:absolute;left:50%;top:14%;transform:translateX(-50%);display:none;z-index:20;
    background:rgba(4,8,16,.92);border:1px solid rgba(0,255,255,.5);border-radius:10px;padding:10px 14px;min-width:min(420px,86vw);}
  #scoreboard table{width:100%;border-collapse:collapse;font-size:14px;}
  #scoreboard th{color:#0ff;font-weight:700;padding:4px 8px;border-bottom:1px solid rgba(0,255,255,.3);}
  #scoreboard td{padding:4px 8px;text-align:center;color:#cfe;}
  #scoreboard tr.me td{color:#ffd23f;font-weight:800;}
  #buyMenu{position:absolute;inset:0;display:none;z-index:20;background:rgba(2,4,10,.72);pointer-events:auto;}
  #buyPanel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,92vw);
    background:rgba(6,10,20,.97);border:1px solid rgba(0,255,255,.5);border-radius:12px;padding:14px;}
  #buyHead{display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:800;color:#0ff;margin-bottom:10px;}
  #buyMoney{color:#7dff9a;}
  #buyClose{background:none;border:1px solid #557;color:#9ab;font-size:14px;border-radius:6px;padding:2px 10px;}
  #buyBody{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .buyItem{background:rgba(0,60,80,.5);border:1px solid rgba(0,255,255,.45);border-radius:8px;color:#dff;
    font-size:14px;padding:10px 6px;display:flex;flex-direction:column;gap:4px;}
  .buyItem span{color:#7dff9a;font-weight:700;}
  .buyItem.dis{opacity:.38;}
  #buyHint{margin-top:10px;font-size:12px;color:#789;text-align:center;}
  #recPanel{margin:10px auto 0;max-width:440px;background:rgba(6,12,22,.75);border:1px solid rgba(255,210,63,.35);
    border-radius:10px;padding:10px 12px;}
  #recTitle{font-size:15px;font-weight:800;color:#ffd23f;margin-bottom:4px;text-align:center;letter-spacing:2px;}
  #recCfg{text-align:center;font-size:12px;color:#0ff;margin-bottom:8px;letter-spacing:1px;}
  .recGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px;}
  .recGrid div{font-size:12px;color:#9ab;text-align:center;background:rgba(0,40,60,.4);border-radius:6px;padding:5px 2px;}
  .recGrid b{display:block;font-size:17px;color:#0ff;}
  #recList{max-height:150px;overflow-y:auto;margin-bottom:6px;}
  .recRow{display:grid;grid-template-columns:70px 1fr auto auto;gap:8px;font-size:12px;color:#bcd;
    padding:4px 6px;border-bottom:1px solid rgba(0,255,255,.12);white-space:nowrap;text-align:left;}
  #recToggle{display:block;margin:4px auto;background:none;border:1px solid rgba(0,255,255,.4);
    color:#0ff;font-size:13px;border-radius:6px;padding:4px 16px;}
  #recEmpty{text-align:center;font-size:13px;color:#789;padding:8px;}
  #recClear{display:block;margin:2px auto 0;background:none;border:1px solid #446;color:#789;font-size:12px;border-radius:6px;padding:3px 12px;}
  #newRec{font-size:18px;font-weight:800;color:#ffd23f;margin-bottom:8px;animation:recPop 1s ease infinite alternate;}
  @keyframes recPop{from{transform:scale(1);}to{transform:scale(1.08);}}
  #lowhp{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(255,0,30,.5));
    opacity:0;}
  #lowhp.on{animation:lowpulse 1s infinite;}
  @keyframes lowpulse{0%,100%{opacity:.25;}50%{opacity:.75;}}
  /* ---------- touch controls ---------- */
  #touchUI{display:none;}
  #joyZone{position:absolute;left:0;bottom:0;width:46%;height:62%;pointer-events:auto;}
  #joyBase{position:absolute;width:110px;height:110px;border-radius:50%;display:none;
    border:2px solid rgba(0,255,255,.5);background:rgba(0,255,255,.07);}
  #joyStick{position:absolute;width:52px;height:52px;border-radius:50%;left:29px;top:29px;
    background:rgba(0,255,255,.35);box-shadow:0 0 14px #0ff;}
  .tbtn{position:absolute;pointer-events:auto;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-weight:800;color:#032;}
  #fireBtn{right:26px;bottom:calc(96px + env(safe-area-inset-bottom));width:96px;height:96px;
    font-size:17px;color:#fff;background:rgba(255,51,85,.35);border:2px solid #ff3355;
    box-shadow:0 0 16px rgba(255,51,85,.6);}
  #fireBtn:active{background:rgba(255,51,85,.65);}
  #jumpBtn{right:140px;bottom:calc(66px + env(safe-area-inset-bottom));width:62px;height:62px;
    font-size:14px;background:rgba(0,255,255,.22);border:2px solid #0ff;color:#0ff;}
  #reloadBtnT{right:36px;bottom:calc(210px + env(safe-area-inset-bottom));width:56px;height:56px;
    font-size:13px;background:rgba(255,210,63,.2);border:2px solid #ffd23f;color:#ffd23f;}
  /* ---------- menu / over ---------- */
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;background:rgba(2,2,12,.72);backdrop-filter:blur(6px);pointer-events:auto;
    padding:20px;text-align:center;z-index:10;}
  #menu{justify-content:flex-start;overflow-y:auto;}
  .title{font-size:44px;font-weight:900;letter-spacing:8px;color:#0ff;
    text-shadow:0 0 24px #0ff,0 0 60px #0ff;}
  .subtitle{margin-top:6px;font-size:14px;letter-spacing:6px;color:#f0f;}
  .feats{margin:14px 0 4px;font-size:13px;line-height:1.9;color:#9db;text-align:center;max-width:600px;}
  .feats b{color:#ffd23f;}
  .bigbtn{margin-top:20px;padding:14px 58px;font-size:20px;font-weight:900;letter-spacing:4px;
    color:#021;border:none;border-radius:12px;background:linear-gradient(135deg,#00ffcc,#00aaff);
    box-shadow:0 0 24px rgba(0,255,200,.7);cursor:pointer;}
  .bigbtn:active{transform:scale(.96);}
  .bigbtn.ghost{background:transparent;color:#0ff;border:1px solid rgba(0,255,255,.6);
    box-shadow:none;margin-top:12px;padding:11px 40px;font-size:16px;letter-spacing:4px;}
  /* ---------- 开始页面选项 ---------- */
  .optRow{margin:7px 0;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;}
  .olab{font-size:14px;color:#9db;letter-spacing:2px;min-width:70px;text-align:right;}
  .optBtn{padding:8px 15px;font-size:14px;font-weight:700;color:#8ef;letter-spacing:1px;
    background:rgba(0,60,80,.4);border:1px solid rgba(0,255,255,.35);border-radius:8px;cursor:pointer;}
  .optBtn.sel{color:#021;background:linear-gradient(135deg,#00ffcc,#00aaff);
    box-shadow:0 0 14px rgba(0,255,200,.6);border-color:transparent;}
  .hint{margin-top:14px;font-size:12px;color:#789;line-height:1.9;}
  #over{display:none;}
  #overStats{margin:16px 0;font-size:16px;line-height:2.1;color:#cfe;}
  #overStats b{color:#ffd23f;font-size:22px;}
</style>
</head>

  <canvas id="game"></canvas>

<script>
/* 霓虹竞技场 NEON ARENA —— 单文件 3D 射击游戏 */
(function(){
'use strict';

/* ================= 工具 ================= */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b+1));
const IS_TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;
const $=id=>document.getElementById(id);

/* ================= 音效（WebAudio 合成，无需素材） ================= */
let AC=null,masterGain=null,muted=false;
function initAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    masterGain=AC.createGain(); masterGain.gain.value=0.45; masterGain.connect(AC.destination);
  }catch(e){AC=null;}
}
function tone(freq,dur,type,vol,slideTo,delay){
  if(!AC||muted)return;
  const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(1,slideTo),t+dur);
  g.gain.setValueAtTime(vol||0.2,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(masterGain); o.start(t); o.stop(t+dur+0.03);
}
/* CS 风格枪声：分层合成（枪口脆响+膛压轰鸣+低频冲击+枪机机械声） */
function nzBurst(t,dur,vol,ftype,ff){
  const len=Math.max(16,Math.floor(AC.sampleRate*dur));
  const buf=AC.createBuffer(1,len,AC.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++){const k=i/len; d[i]=(Math.random()*2-1)*Math.pow(1-k,2.4);}
  const s=AC.createBufferSource(); s.buffer=buf;
  const f=AC.createBiquadFilter(); f.type=ftype; f.frequency.value=ff;
  const g=AC.createGain();
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f); f.connect(g); g.connect(masterGain);
  s.start(t); s.stop(t+dur+0.03);
}
function thumpSfx(t,f0,dur,vol){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f0*0.45),t+dur);
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t+dur+0.03);
}
function mechClick(t,vol,f){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='square'; o.frequency.value=f||3000;
  g.gain.setValueAtTime(vol||0.07,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.03);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t+0.05);
}
const GUN_SND={
  smg:    {crack:3600,body:2200,bodyT:0.07,thump:160,thumpT:0.08,v:0.75}, // MP5：9mm短促脆响
  rifle:  {crack:1800,body:800, bodyT:0.18,thump:70, thumpT:0.22,v:1.0},  // AK-47：7.62浑厚长音
  shotgun:{crack:1100,body:500, bodyT:0.30,thump:50, thumpT:0.40,v:1.15}, // Nova：12号轰鸣
  awp:    {crack:800, body:350, bodyT:0.45,thump:40, thumpT:0.55,v:1.2},  // AWP：重炮长尾音
  deagle: {crack:1500,body:600, bodyT:0.25,thump:60, thumpT:0.30,v:1.05}, // 沙鹰：手炮闷响
  enemy:  {crack:1800,body:1000,bodyT:0.12,thump:90, thumpT:0.14,v:0.35}
};
function sfxShoot(k){
  if(!AC||muted)return;
  const p=GUN_SND[k]||GUN_SND.enemy;

/* ================= 背景音乐（WebAudio 合成电子乐，无素材） ================= */
const CHORDS=[
  {root:45,tones:[57,60,64]},   // Am
  {root:41,tones:[53,57,60]},   // F
  {root:36,tones:[60,64,67]},   // C
  {root:43,tones:[59,62,67]}    // G
];
const mtof=m=>440*Math.pow(2,(m-69)/12);
let musicBus=null,mDelay=null;
function musicNodes(){
  if(musicBus||!AC)return;
  musicBus=AC.createGain(); musicBus.gain.value=0.4; musicBus.connect(masterGain);
  mDelay=AC.createDelay(1);
  mDelay.delayTime.value=60/116/4*3; // 附点八分延迟，制造空间感
  const fb=AC.createGain(); fb.gain.value=0.32;
  mDelay.connect(fb); fb.connect(mDelay); mDelay.connect(musicBus);
}
function mNote(m,t,dur,type,vol,lp,delaySend){
  const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
  o.type=type; o.frequency.value=mtof(m);
  f.type='lowpass'; f.frequency.value=lp||9000;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(f); f.connect(g); g.connect(musicBus);
  if(delaySend)g.connect(mDelay);
  o.start(t); o.stop(t+dur+0.05);
}
function mKick(t){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(150,t);
  o.frequency.exponentialRampToValueAtTime(42,t+0.12);
  g.gain.setValueAtTime(0.5,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.24);
  o.connect(g); g.connect(musicBus); o.start(t); o.stop(t+0.3);
}
function mNoise(t,dur,vol,ftype,ffreq){
  const len=Math.floor(AC.sampleRate*dur);
  const buf=AC.createBuffer(1,len,AC.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5);
  const src=AC.createBufferSource(); src.buffer=buf;
  const f=AC.createBiquadFilter(); f.type=ftype; f.frequency.value=ffreq;
  const g=AC.createGain(); g.gain.value=vol;
  src.connect(f); f.connect(g); g.connect(musicBus); src.start(t);
}
function mStep(s,t){
  const bar=(s>>4)&3, st=s&15, ch=CHORDS[bar];
  if(st%4===0)mKick(t);                                            // 底鼓
  if(st===4||st===12){mNoise(t,0.16,0.28,'bandpass',1900);mNote(50,t,0.1,'triangle',0.12,3000);} // 军鼓
  if(st%2===0)mNoise(t,0.05,0.10,'highpass',7500);                  // 踩镲
  if(st%2===0)mNote(st===14?ch.root+12:ch.root,t,0.22,'sawtooth',0.20,700); // 贝斯
  const at=[ch.tones[0],ch.tones[1],ch.tones[2],ch.tones[0]+12];    // 琶音
  mNote(at[s%4],t,0.11,'square',0.055,6000,true);
}
const Music={
  playing:false,step:0,nextT:0,timer:null,bpm:116,
  start(){
    if(this.playing)return;
    initAudio();
    if(!AC)return;
    musicNodes();
    this.playing=true; this.step=0;
    this.nextT=AC.currentTime+0.08;
    this.tick();
  },
  stop(){ this.playing=false; clearTimeout(this.timer); },
  tick(){
    if(!this.playing)return;
    const spb=60/this.bpm/4;
    while(this.nextT<AC.currentTime+0.28){
      mStep(this.step,this.nextT);
      this.nextT+=spb; this.step=(this.step+1)%64;
    }
    this.timer=setTimeout(()=>this.tick(),90);
  }
};

/* 从高度图(canvas明暗)生成法线贴图，制造凹凸感 */
function canvasToNormal(canvas,strength){
  const w=canvas.width,h=canvas.height;
  const src=canvas.getContext('2d').getImageData(0,0,w,h).data;
  const out=document.createElement('canvas'); out.width=w; out.height=h;
  const g=out.getContext('2d');
  const img=g.createImageData(w,h);
  const hv=(x,y)=>{
    x=(x+w)%w; y=(y+h)%h;
    const i=(y*w+x)*4;
    return (src[i]*0.35+src[i+1]*0.5+src[i+2]*0.15)/255;
  };
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const dx=(hv(x-1,y)-hv(x+1,y))*strength;
    const dy=(hv(x,y-1)-hv(x,y+1))*strength;
    const inv=1/Math.sqrt(dx*dx+dy*dy+1);
    const i=(y*w+x)*4;
    img.data[i]=(-dx*inv*0.5+0.5)*255;
    img.data[i+1]=(dy*inv*0.5+0.5)*255;
    img.data[i+2]=(inv*0.5+0.5)*255;
    img.data[i+3]=255;
  }
  g.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(out);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  return t;
}

function makeSkyTexture(s){

      const ng=g.createRadialGradient(n[0],n[1],0,n[0],n[1],n[2]);
      ng.addColorStop(0,'rgba('+n[3]+',0.10)'); ng.addColorStop(1,'rgba('+n[3]+',0)');
      g.fillStyle=ng; g.beginPath(); g.arc(n[0],n[1],n[2],0,7); g.fill();
    }

    for(let i=0;i<16;i++){
      const cx=Math.random()*2048,cy=rand(60,330),cw=rand(120,300),ch=rand(24,54);

    g.beginPath(); g.arc(Math.random()*2048,Math.random()*430,rand(0.6,1.8),0,7); g.fill();
  }
  const sx=1560,sy=s.sunY;

  sg.addColorStop(0,'rgba('+s.sunGlow+',0.55)'); sg.addColorStop(1,'rgba('+s.sunGlow+',0)');

  }
  let x=0;
  while(x<2048){
    const bw=rand(60,170),bh=rand(90,260);
    g.fillStyle=s.city;
    g.fillRect(x,540-bh,bw,bh+30);
    for(let wy=540-bh+14;wy<528;wy+=22){
      for(let wx=x+8;wx<x+bw-8;wx+=16){
        if(Math.random()<s.winA+0.1){

}

// 圆形 vs AABB 碰撞推挤
const _tmpC=new THREE.Vector3();
function collideCircle(pos,radius){
  for(const o of obstacles){
    const cx=clamp(pos.x,o.min.x,o.max.x),cz=clamp(pos.z,o.min.z,o.max.z);
    const dx=pos.x-cx,dz=pos.z-cz,d2=dx*dx+dz*dz;
    if(d2<radius*radius){
      if(d2>1e-8){const d=Math.sqrt(d2);pos.x=cx+dx/d*radius;pos.z=cz+dz/d*radius;}
      else pos.x=o.max.x+radius;
    }
  }
  pos.x=clamp(pos.x,-MAP_SIZE+1.2,MAP_SIZE-1.2);
  pos.z=clamp(pos.z,-MAP_SIZE+1.2,MAP_SIZE-1.2);
}
const raycaster=new THREE.Raycaster(); raycaster.far=70;
function hasLOS(from,to){
  _tmpC.copy(to).sub(from);
  const dist=_tmpC.length(); _tmpC.normalize();
  raycaster.set(from,_tmpC); raycaster.far=dist;
  const hits=raycaster.intersectObjects(colliderMeshes,false);
  raycaster.far=70;
  return hits.length===0;
}

function spawnPointFar(){
  for(let i=0;i<12;i++){
    const x=rand(-MAP_SIZE+4,MAP_SIZE-4),z=rand(-MAP_SIZE+4,MAP_SIZE-4);
    if(Math.hypot(x-player.pos.x,z-player.pos.z)>16)return new THREE.Vector3(x,0,z);
  }
  return new THREE.Vector3(-player.pos.x*0.8,0,-player.pos.z*0.8);
}

const UNIFORM_SETS=[
  {base:'#6b6f4e',s1:'#565a3c',s2:'#7d815c',vest:0x3a3d33,helm:0x4a4d40},
  {base:'#8a7a5c',s1:'#6e6248',s2:'#9c8d6e',vest:0x4a4238,helm:0x6e6250},
  {base:'#5c6068',s1:'#484c54',s2:'#70767e',vest:0x33363c,helm:0x484c54},

];

const DIFF_ACCENT=[0x39ff6a,0xffe14d,0xff9a2e,0xff4444];
const _camoTexCache=[];
function getCamoTex(i){ // 程序化迷彩纹理
  if(_camoTexCache[i])return _camoTexCache[i];
  const s=UNIFORM_SETS[i];
  const c=document.createElement('canvas'); c.width=c.height=128;
  const x=c.getContext('2d');
  x.fillStyle=s.base; x.fillRect(0,0,128,128);
  for(let n=0;n<110;n++){
    x.fillStyle=n%2?s.s1:s.s2;
    x.globalAlpha=0.45+Math.random()*0.35;
    const w=5+Math.random()*13,h=4+Math.random()*9;
    x.save(); x.translate(Math.random()*128,Math.random()*128); x.rotate(Math.random()*Math.PI);
    x.beginPath(); x.ellipse(0,0,w/2,h/2,0,0,Math.PI*2); x.fill(); x.restore();
  }
  x.globalAlpha=0.10; x.fillStyle='#000';
  for(let n=0;n<400;n++)x.fillRect(Math.random()*128,Math.random()*128,1.5,1.5);
  x.globalAlpha=1;
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(1.6,1.6);
  _camoTexCache[i]=t; return t;
}

/* 按开始页面的敌人数量启用/停用机器人 */
function applyBotCount(){
  const n=ENEMY_OPTS[gameCfg.enemyIdx];
  for(let i=0;i<bots.length;i++){
    const b=bots[i];
    b.enabled=i<n;
    if(b.enabled)respawnBot(b,true);
    else{b.alive=false;b.g.visible=false;}
  }
}
function respawnBot(bot,first){
  const p=spawnPointFar();
  bot.pos.copy(p); bot.maxHp=diffPreset.hp; bot.hp=bot.maxHp; bot.alive=true;
  bot.hpFg.scale.x=1; bot.hpFg.material.color.setHex(0x33ff66);
  for(const m of bot.flashMats)m.emissive.setHex(0x000000);
  bot.dying=false; bot.dieT=0; bot.g.rotation.x=0; bot.g.rotation.z=0;
  bot.dieAxis=Math.random()<0.7?'x':'z'; bot.dieSide=Math.random()<0.5?1:-1;
  bot.tactic='direct'; bot.tactT=rand(1,3); bot.hasLOS=false; bot.heard=false;
  bot.dodgeT=0; bot.burstN=0;
  bot.recoil=0; bot.muzT=0; bot.muzFlash.visible=false;
  bot.shootCd=rand(0.8,1.8)*diffPreset.cd; bot.reaction=0;
  bot.g.visible=true;
  bot.g.position.copy(bot.pos);
  if(!first)spawnBurst(bot.pos.clone().add(new THREE.Vector3(0,1.2,0)),0x00ffff,14,5,0.5);
}
const _v1=new THREE.Vector3(),_v2=new THREE.Vector3(),_v3=new THREE.Vector3();
function botEyePos(bot,out){return out.set(bot.pos.x,bot.pos.y+1.5,bot.pos.z);}
/* ================= 声音感知：枪声/爆炸暴露位置 ================= */
let lastNoiseT=-99,lastNoiseX=0,lastNoiseZ=0;
function makeNoise(x,z){lastNoiseT=elapsed;lastNoiseX=x;lastNoiseZ=z;}
function updateBot(bot,dt){
  if(!bot.enabled)return;
  if(bot.dying){ // 倒地动画
    bot.dieT+=dt;
    const k=Math.min(bot.dieT/0.38,1);
    if(bot.dieAxis==='x')bot.g.rotation.x=-k*k*1.35;
    else bot.g.rotation.z=k*k*1.35*bot.dieSide;
    if(bot.dieT>1.25){bot.dying=false;bot.alive=false;bot.g.visible=false;bot.g.rotation.x=0;bot.g.rotation.z=0;}
    return;
  }
  if(!bot.alive){
    bot.respawnT-=dt;
    if(bot.respawnT<=0&&state==='playing')respawnBot(bot,false);
    return;
  }
  _v1.set(player.pos.x-bot.pos.x,0,player.pos.z-bot.pos.z);
  const dist=_v1.length()||0.001;
  const dx=_v1.x/dist,dz=_v1.z/dist;
  bot.g.rotation.y=Math.atan2(dx,dz);
  // 战术决策：包抄 / 拉扯 / 走位 / 直来
  bot.tactT-=dt;
  if(bot.tactT<=0){
    bot.tactT=rand(2.5,5);
    bot.tactic='direct';
    const allies=bots.filter(b=>b!==bot&&b.enabled&&b.alive&&!b.dying).length;
    const r=Math.random();
    if(bot.hp<bot.maxHp*0.35&&dist<26)bot.tactic='retreat';       // 残血拉扯
    else if(allies>=1&&dist<26&&dist>10&&r<0.45){bot.tactic='flank';bot.flankDir=Math.random()<0.5?1:-1;} // 包抄
    else if(r<0.65)bot.tactic='strafe';                            // 走位扫射
  }
  // 听声辨位：无视野且刚听到枪声/爆炸，朝声源移动
  bot.heard=false;
  if(elapsed-lastNoiseT<1.5){
    const ndx=lastNoiseX-bot.pos.x,ndz=lastNoiseZ-bot.pos.z;
    const nd=Math.hypot(ndx,ndz);
    if(nd>4&&nd<34)bot.heard=true;
  }
  let mx=0,mz=0;
  const spd=bot.speed*diffPreset.spd+difficulty*1.6;
  if(bot.dodgeT>0){ // 躲手雷：往炸点反方向跑
    bot.dodgeT-=dt;
    const fx=bot.pos.x-bot.fleeX,fz=bot.pos.z-bot.fleeZ;
    const fl=Math.hypot(fx,fz)||0.001;
    mx=fx/fl; mz=fz/fl;
  }else if(bot.heard&&!bot.hasLOS){
    const nx=lastNoiseX-bot.pos.x,nz=lastNoiseZ-bot.pos.z;
    const nl=Math.hypot(nx,nz)||0.001;
    mx=nx/nl; mz=nz/nl;
  }else if(dist>28){mx=dx;mz=dz;}
  else if(bot.tactic==='flank'){ // 包抄：绕到侧面
    const a=Math.atan2(dx,dz)+bot.flankDir*1.0;
    mx=Math.sin(a); mz=Math.cos(a);
  }else if(bot.tactic==='retreat'){ // 残血边打边退
    bot.strafT-=dt;
    if(bot.strafT<=0){bot.strafDir*=-1;bot.strafT=rand(0.5,1.1);}
    mx=-dx*1.1-dz*bot.strafDir*0.8; mz=-dz*1.1+dx*bot.strafDir*0.8;
  }else if(bot.tactic==='strafe'||dist>=9){ // 走位扫射
    bot.strafT-=dt;
    if(bot.strafT<=0){bot.strafDir*=-1;bot.strafT=rand(1,2.4);}
    mx=-dz*bot.strafDir+dx*0.3; mz=dx*bot.strafDir+dz*0.3;
  }else{mx=-dx;mz=-dz;}
  _v2.set(bot.pos.x+mx*spd*dt,0,bot.pos.z+mz*spd*dt);
  collideCircle(_v2,0.55);
  bot.pos.x=_v2.x; bot.pos.z=_v2.z;
  // 走路动画：腿摆动 + 身体起伏（手臂持枪不动）
  bot.walkPhase+=dt*(3+spd*1.1);
  const sw=Math.sin(bot.walkPhase);
  bot.legL.rotation.x=sw*0.55; bot.legR.rotation.x=-sw*0.55;
  bot.g.position.set(bot.pos.x,Math.abs(Math.cos(bot.walkPhase))*0.045,bot.pos.z);
  bot.stepT=(bot.stepT||0)-dt*(2+spd*0.25); // 敌人脚步声，随距离衰减
  if(bot.stepT<=0){bot.stepT=0.42;
    const sd=Math.hypot(player.pos.x-bot.pos.x,player.pos.z-bot.pos.z);
    if(sd<32)sfxStep(clamp(1-sd/32,0,1)*0.22);
  }
  // 步枪后座恢复
  if(bot.recoil>0)bot.recoil=Math.max(0,bot.recoil-dt*6);
  bot.rifle.position.z=0.30+bot.recoil*0.06;
  bot.rifle.rotation.x=bot.recoil*0.12;
  if(bot.muzT>0){bot.muzT-=dt; if(bot.muzT<=0)bot.muzFlash.visible=false;}
  if(bot.flashT>0){bot.flashT-=dt;if(bot.flashT<=0)for(const m of bot.flashMats)m.emissive.setHex(0x000000);}
  if(!player.alive)return;
  // 开火（致盲/躲雷时停火）
  if(bot.blindT>0){bot.blindT-=dt;}
  else if(bot.dodgeT>0){bot.shootCd=Math.max(bot.shootCd,0.3);bot.reaction=0;}
  else{
  bot.shootCd-=dt;
  if(bot.shootCd<=0&&dist<34){
    botEyePos(bot,_v3);
    _v2.set(player.pos.x,EYE+player.y,player.pos.z);
    if(hasLOS(_v3,_v2)&&!smokeBlocked(_v3,_v2)){
      bot.hasLOS=true; bot.reaction=0.3;
      let cd=rand(0.75,1.5)*diffPreset.cd*(1-difficulty*0.3);
      if(dist>20){ // 远距离点射：3发一停顿
        bot.burstN++;
        if(bot.burstN>=3){bot.burstN=0;cd+=rand(0.4,0.7);}
      }else if(dist<12){cd*=0.7;} // 近距离泼水
      bot.shootCd=cd;
    }
    else{bot.hasLOS=false;bot.shootCd=0.35;}
  }
  if(bot.reaction>0){
    bot.reaction-=dt;
    if(bot.reaction<=0&&player.alive){
      botEyePos(bot,_v3);
      _v2.set(player.pos.x,EYE+player.y,player.pos.z);
      if(hasLOS(_v3,_v2)&&!smokeBlocked(_v3,_v2))botFire(bot,dist);
      else bot.hasLOS=false;
    }
  }
  }
}
function botFire(bot,dist){
  bot.muzzleTip.getWorldPosition(_v3);
  const from=_v3.clone();
  bot.muzT=0.06; bot.muzFlash.visible=true;
  bot.muzFlash.rotation.z=Math.random()*Math.PI;
  const fs=0.8+Math.random()*0.5; bot.muzFlash.scale.set(fs,fs,1);
  bot.recoil=1;
  const hitChance=clamp(0.52-dist*0.011,0.08,0.55)+diffPreset.aim+difficulty*0.12;
  const hit=Math.random()<hitChance&&player.invuln<=0;
  const target=_v2.clone();
  if(!hit){target.x+=rand(-1.6,1.6);target.y+=rand(-0.6,1.2);target.z+=rand(-1.6,1.6);}
  fireTracer(from,target,0xff6688);
  spawnBurst(from,0xffaa33,4,3,0.25);
  sfxShoot('enemy');
  if(hit&&player.alive){
    damagePlayer((rand(6,11)+difficulty*4)*diffPreset.dmg,bot.name);
  }
}

const PMAX=260;
const pGeo=new THREE.BufferGeometry();
const pPos=new Float32Array(PMAX*3),pCol=new Float32Array(PMAX*3);
const pVel=new Float32Array(PMAX*3),pLife=new Float32Array(PMAX);
for(let i=0;i<PMAX;i++){pPos[i*3+1]=-999;}
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute('color',new THREE.BufferAttribute(pCol,3));
const points=new THREE.Points(pGeo,new THREE.PointsMaterial({size:0.2,vertexColors:true,
  transparent:true,opacity:0.95,blending:THREE.AdditiveBlending,depthWrite:false}));
points.frustumCulled=false; scene.add(points);
let pCursor=0;
const _c=new THREE.Color();
function spawnBurst(pos,colorHex,n,speed,life){
  _c.setHex(colorHex);
  for(let k=0;k<n;k++){
    const i=pCursor; pCursor=(pCursor+1)%PMAX;
    pPos[i*3]=pos.x;pPos[i*3+1]=pos.y;pPos[i*3+2]=pos.z;
    const th=rand(0,Math.PI*2),ph=rand(-1,1),sp=rand(0.3,1)*speed;
    pVel[i*3]=Math.cos(th)*sp;pVel[i*3+1]=ph*sp+speed*0.35;pVel[i*3+2]=Math.sin(th)*sp;
    pLife[i]=rand(0.6,1)*life;
    pCol[i*3]=_c.r;pCol[i*3+1]=_c.g;pCol[i*3+2]=_c.b;
  }
}
function updateParticles(dt){
  for(let i=0;i<PMAX;i++){
    if(pLife[i]<=0)continue;
    pLife[i]-=dt;
    if(pLife[i]<=0){pPos[i*3+1]=-999;continue;}
    pVel[i*3+1]-=9*dt;
    pPos[i*3]+=pVel[i*3]*dt;pPos[i*3+1]+=pVel[i*3+1]*dt;pPos[i*3+2]+=pVel[i*3+2]*dt;
    if(pPos[i*3+1]<0.02){pPos[i*3+1]=0.02;pVel[i*3+1]*=-0.4;}
  }
  pGeo.attributes.position.needsUpdate=true;
  pGeo.attributes.color.needsUpdate=true;
}
/* ================= 曳光弹 ================= */
const tracers=[];
for(let i=0;i<22;i++){
  const m=new THREE.Mesh(new THREE.BoxGeometry(0.035,0.035,1),
    new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,
      blending:THREE.AdditiveBlending,depthWrite:false}));
  m.visible=false; scene.add(m);
  tracers.push({m:m,life:0});
}
function fireTracer(from,to,colorHex){
  for(const t of tracers){
    if(t.life>0)continue;
    t.life=0.08;
    t.m.visible=true;
    t.m.material.color.setHex(colorHex);
    t.m.material.opacity=0.9;
    t.m.position.copy(from).add(to).multiplyScalar(0.5);
    t.m.lookAt(to);
    t.m.scale.set(1,1,from.distanceTo(to));
    return;
  }
}
function updateTracers(dt){
  for(const t of tracers){
    if(t.life<=0)continue;
    t.life-=dt;
    t.m.material.opacity=Math.max(0,t.life/0.08)*0.9;
    if(t.life<=0)t.m.visible=false;
  }
}

const dmgPool=[];
for(let i=0;i<18;i++){
  const d=document.createElement('div'); d.className='dmg'; d.style.display='none';
  $('dmgnums').appendChild(d);
  dmgPool.push({el:d,age:0,world:new THREE.Vector3(),vy:0});
}
let dmgCursor=0;
const _pv=new THREE.Vector3();
function spawnDmgNum(worldPos,text,cls){
  const d=dmgPool[dmgCursor]; dmgCursor=(dmgCursor+1)%dmgPool.length;
  d.el.textContent=text; d.el.className='dmg '+(cls||'');
  d.el.style.display='block'; d.age=0.75; d.world.copy(worldPos); d.vy=0;
}
function updateDmgNums(dt){
  const w=window.innerWidth,h=window.innerHeight;
  for(const d of dmgPool){
    if(d.age<=0)continue;
    d.age-=dt;
    if(d.age<=0){d.el.style.display='none';continue;}
    d.world.y+=dt*1.1;
    _pv.copy(d.world).project(camera);
    if(_pv.z>1){d.el.style.display='none';d.age=0;continue;}
    d.el.style.left=((_pv.x*0.5+0.5)*w)+'px';
    d.el.style.top=((-_pv.y*0.5+0.5)*h)+'px';
    d.el.style.opacity=Math.min(1,d.age/0.3);
  }
}
/* ================= 玩家射击 ================= */
const _dir=new THREE.Vector3(),_origin=new THREE.Vector3(),_hitP=new THREE.Vector3();
let autoTarget=false;
function checkAutoTarget(){
  autoTarget=false;
  if(!autoFire||!player.alive)return;
  camera.getWorldDirection(_dir);
  _origin.copy(camera.position);
  raycaster.set(_origin,_dir);
  const targets=[];
  for(const b of bots)if(b.enabled&&b.alive)targets.push(...b.hitMeshes);
  const hits=raycaster.intersectObjects(targets,false);
  if(hits.length>0&&hits[0].distance<40)autoTarget=true;
  $('cross').classList.toggle('hot',autoTarget);
}
function dmgFalloff(key,d){ // 伤害随距离衰减：每种枪特性不同
  if(key==='shotgun'){ // 霰弹：8米内全额，22米外只剩25%
    if(d<8)return 1; if(d>22)return 0.25;
    return 1-(d-8)/14*0.75;
  }
  if(key==='smg'){ // 冲锋枪：中距离开始衰减
    if(d<12)return 1; if(d>30)return 0.6;
    return 1-(d-12)/18*0.4;
  }
  if(key==='deagle'){ // 沙鹰：手枪弹远距离掉得快
    if(d<10)return 1; if(d>28)return 0.55;
    return 1-(d-10)/18*0.45;
  }
  if(key==='rifle'){ // 步枪：衰减最轻微
    if(d<15)return 1; if(d>35)return 0.75;
    return 1-(d-15)/20*0.25;
  }
  return 1; // AWP：狙击无衰减
}
function tryFire(){
  const w=WEAPONS[player.cur];
  if(player.fireCd>0||player.reloading>0||!player.alive||state!=='playing')return;
  const wantFire=firing||(autoFire&&autoTarget);
  if(!wantFire)return;
  if(player.ammo[player.cur]<=0){sfxEmpty();startReload();player.fireCd=0.25;return;}
  player.fireCd=w.interval;
  player.ammo[player.cur]--;
  player.shots++;
  updateAmmoHUD();
  if(player.ammo[player.cur]===0)startReload();
  // 后座：每种枪手感不同（AK上跳+左右抖，MP5稳）
  player.pitch=clamp(player.pitch+w.kick*rand(0.7,1.3),-1.45,1.45);
  player.yaw+=rand(-1,1)*(w.yawKick||0);
  player.fovKick=Math.min(4,player.fovKick+1.2);
  player.bloom=Math.min(22,player.bloom+(w.bloomAdd||5)); // 连射扩散积累
  gunKick=0.09; muzzleT=0.05;
  muzzle.material.opacity=0.95;
  muzzleLight.intensity=30;
  sfxShoot(player.cur);
  const wasScoped=player.cur==='awp'&&player.scoped;
  if(wasScoped){player.scoped=false;applyScope();} // AWP 开火后退镜
  makeNoise(player.pos.x,player.pos.z); // 开枪声暴露位置
  camera.getWorldDirection(_dir);
  _origin.copy(camera.position);
  const from=_origin.clone().add(_dir.clone().multiplyScalar(0.6));
  let anyHit=false;
  // 实际散布 = 基础 × 连射扩散 × 移动惩罚（准星会诚实反映）
  const moveMul=1+(player.moving?(w.movePen||0):0);
  const sprayMul=1+player.bloom*0.05;
  const baseSpread=(player.cur==='awp'&&wasScoped)?w.scopedSpread:w.spread;
  const spread=baseSpread*sprayMul*moveMul;
  for(let p=0;p<w.pellets;p++){
    _v1.copy(_dir);
    _v1.x+=rand(-spread,spread);_v1.y+=rand(-spread,spread);_v1.z+=rand(-spread,spread);
    _v1.normalize();
    raycaster.set(_origin,_v1);
    const targets=[];
    for(const b of bots)if(b.enabled&&b.alive)targets.push(...b.hitMeshes);
    const all=targets.concat(colliderMeshes);
    const hits=raycaster.intersectObjects(all,false);
    let end=null;
    for(const h of hits){
      const ud=h.object.userData;
      if(ud.bot&&ud.bot.alive){ // 命中机器人
        const headshot=ud.part==='head';
        const shotDist=_origin.distanceTo(h.point);
        const dmg=w.dmg*(headshot?2:1)*dmgFalloff(player.cur,shotDist);
        damageBot(ud.bot,dmg,h.point,headshot);
        anyHit=true; end=h.point; break;
      }else if(ud.bot&&!ud.bot.alive){continue;}
      else{ // 打中掩体
        spawnBurst(h.point,0x00ddff,5,3,0.3);
        end=h.point; break;
      }
    }
    if(!end)end=_origin.clone().add(_v1.multiplyScalar(50));
    fireTracer(from,end,w.color);
  }
  if(anyHit)player.hits++;
}
function damageBot(bot,dmg,point,headshot){
  bot.hp-=dmg;
  for(const m of bot.flashMats)m.emissive.setHex(0x666666); bot.flashT=0.07;
  bot.hpFg.scale.x=clamp(bot.hp/bot.maxHp,0,1);
  bot.hpFg.material.color.setHex(bot.hp>50?0x33ff66:(bot.hp>25?0xffcc33:0xff3333));
  spawnBurst(point,headshot?0xffd23f:0xff5555,headshot?12:7,5,0.4);
  spawnDmgNum(point.clone(),Math.round(dmg),headshot?'head':'');
  showHitmarker(headshot);
  if(headshot)sfxHeadshot();else sfxHit();
  if(bot.hp<=0&&bot.alive&&!bot.dying)killBot(bot,headshot);
}
function showHitmarker(head){
  const h=$('hitm');
  h.classList.toggle('head',!!head);
  h.classList.remove('show'); void h.offsetWidth; h.classList.add('show');
  clearTimeout(showHitmarker.t);
  showHitmarker.t=setTimeout(()=>h.classList.remove('show'),130);
}
function killBot(bot,headshot){
  if(bot.dying)return;
  bot.dying=true; bot.dieT=0; bot.respawnT=1.8;
  bot.muzFlash.visible=false;
  player.kills++; player.streak++;
  if(headshot)player.headshots++;
  const rw=headshot?400:300; player.money+=rw; updateMoneyHUD();
  player.bestStreak=Math.max(player.bestStreak,player.streak);
  player.multi++; player.multiT=4;
  const bonus=headshot?150:100;
  addScore(bonus);
  feedKill('你',bot.name,true);
  sfxKill();
  boomLight.position.set(bot.pos.x,1.5,bot.pos.z); boomLight.intensity=25;
  _v1.set(bot.pos.x,1.2,bot.pos.z);
  spawnBurst(_v1,0xffd23f,14,6,0.6);
  spawnBurst(_v1,0xaa2222,10,4,0.5);
  spawnDmgNum(_v1.clone().add(new THREE.Vector3(0,0.8,0)),(headshot?'爆头 +':'+')+bonus,'head');
  if(player.multi===2)announce('双杀 DOUBLE KILL');
  else if(player.multi===3)announce('三杀 TRIPLE KILL');
  else if(player.multi>=4)announce('暴走 RAMPAGE');
  // Doom式：击杀掉血包，奖励进攻
  if(Math.random()<0.4)spawnOrb(_v1.clone());
  else if(player.hp<60)spawnOrb(_v1.clone());
}
function damagePlayer(dmg,fromName){
  if(!player.alive||player.invuln>0||state!=='playing')return;
  if(player.armor>0){const ab=Math.min(player.armor,dmg*0.5);player.armor-=ab;dmg-=ab;}
  player.hp-=dmg;
  player.shake=Math.min(1,player.shake+0.35);
  $('flash').style.opacity=0.85;
  setTimeout(()=>{$('flash').style.opacity=0;},120);
  sfxHurt();
  _v1.set(player.pos.x,EYE+player.y,player.pos.z);
  spawnDmgNum(_v1.clone().add(new THREE.Vector3(rand(-0.5,0.5),0.4,0)),'-'+Math.round(dmg),'hurt');
  updateHpHUD();
  if(player.hp<=0){
    player.hp=0; player.alive=false; player.deaths++;
    player.streak=0; player.multi=0; player.respawnT=2.5;
    gun.visible=false;
    const kb=bots.find(x=>x.name===fromName); if(kb)kb.kills++;
    feedKill(fromName,'你',false);
    announce('你被击倒了');
    sfxDie();
    updateHpHUD();
  }
}

const pickups=[];
const PICKUP_STYLE={
  rifle:{color:0xffaa00,label:'AK-47'},
  shotgun:{color:0xff3355,label:'Nova'},
  awp:{color:0x66ccff,label:'AWP'},
  deagle:{color:0xffcc44,label:'沙漠之鹰'},
  armor:{color:0x4488ff,label:'护甲+50'},
  health:{color:0x33ff66,label:'医疗包+40'}
};
function makePickup(spot){
  const st=PICKUP_STYLE[spot.type];
  const g=new THREE.Group();
  const box=new THREE.Mesh(new THREE.BoxGeometry(0.55,0.55,0.55),
    new THREE.MeshStandardMaterial({color:0x101020,emissive:st.color,emissiveIntensity:0.55,roughness:0.4,metalness:0.3}));
  box.position.y=1.0; box.castShadow=true; g.add(box);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(0.62,0.05,8,26),
    new THREE.MeshBasicMaterial({color:st.color}));
  ring.rotation.x=Math.PI/2; ring.position.y=0.25; g.add(ring);
  g.position.set(spot.x,0,spot.z);
  scene.add(g);
  pickups.push({type:spot.type,g:g,t:rand(0,6),cd:0,spot:spot});
}
function updatePickups(dt){
  for(const p of pickups){
    if(p.cd>0){
      p.cd-=dt;
      p.g.visible=p.cd<=0;
      if(p.cd>0)continue;
    }
    p.t+=dt;
    p.g.rotation.y+=dt*1.6;
    p.g.children[0].position.y=1.0+Math.sin(p.t*2.4)*0.14;
    if(!player.alive)continue;
    const d=Math.hypot(p.g.position.x-player.pos.x,p.g.position.z-player.pos.z);
    if(d<1.9){
      const st=PICKUP_STYLE[p.type];
      if(p.type==='health'){
        if(player.hp>=100)continue;
        player.hp=Math.min(100,player.hp+40); updateHpHUD();
      }else if(p.type==='armor'){
        if(player.armor>=100)continue;
        player.armor=Math.min(100,player.armor+50); updateHpHUD();
      }else{
        player.owned[p.type]=true;
        player.ammo[p.type]=WEAPONS[p.type].mag;
        switchWeapon(p.type);
      }
      announce('拾取 '+st.label);
      sfxPickup();
      spawnBurst(new THREE.Vector3(p.g.position.x,1.2,p.g.position.z),st.color,16,5,0.5);
      p.cd=14; p.g.visible=false;
    }
  }
}
/* 血包（击杀掉落） */
const orbs=[];
function spawnOrb(pos){
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.22,10,10),
    new THREE.MeshBasicMaterial({color:0x33ff88}));
  m.position.set(pos.x,0.8,pos.z); scene.add(m);
  orbs.push({m:m,t:0,life:12});
}
function updateOrbs(dt){
  for(let i=orbs.length-1;i>=0;i--){
    const o=orbs[i]; o.t+=dt; o.life-=dt;
    o.m.position.y=0.8+Math.sin(o.t*4)*0.12;
    o.m.rotation.y+=dt*3;
    let take=false;
    if(player.alive){
      _v1.set(o.m.position.x-player.pos.x,0,o.m.position.z-player.pos.z);
      const d=_v1.length();
      if(d<4){ // 磁吸
        _v1.normalize();
        o.m.position.x-=_v1.x*dt*7; o.m.position.z-=_v1.z*dt*7;
      }
      if(d<1.2)take=true;
    }
    if(take){
      player.hp=Math.min(100,player.hp+15); updateHpHUD(); sfxOrb();
      spawnBurst(o.m.position,0x33ff88,10,4,0.4);
    }
    if(take||o.life<=0){scene.remove(o.m);orbs.splice(i,1);}
  }
}

/* ================= HUD ================= */
function updateHpHUD(){
  const pct=clamp(player.hp,0,100);
  $('hpfill').style.width=pct+'%';
  $('hpfill').style.background=pct>50?'linear-gradient(90deg,#00ff9d,#00e5ff)':
    (pct>25?'linear-gradient(90deg,#ffcc33,#ff9933)':'linear-gradient(90deg,#ff3344,#ff6655)');
  $('hptext').textContent='HP '+Math.ceil(pct);
  $('lowhp').classList.toggle('on',pct<=30&&pct>0&&player.alive);
  const ap=clamp(player.armor,0,100);
  $('armorfill').style.width=ap+'%';
  $('armorbar').style.display=ap>0?'block':'none';
}
function updateAmmoHUD(){
  const a=$('ammo');
  a.textContent=player.reloading>0?'--':player.ammo[player.cur];
  a.classList.toggle('low',player.ammo[player.cur]<=WEAPONS[player.cur].mag*0.25);

function addScore(n){
  player.score=(player.score||0)+n;
  $('score').textContent=player.score+' 击杀';
}
let announceT=null;
function announce(text){
  const el=$('announce');
  el.textContent=text; el.classList.add('show');
  clearTimeout(announceT);
  announceT=setTimeout(()=>el.classList.remove('show'),1300);
}
function feedKill(killer,victim,me){
  const kf=$('killfeed');
  const d=document.createElement('div');
  d.textContent=killer+' ⚔ '+victim;
  d.className=me?'me':(victim==='你'?'dead':'');
  kf.prepend(d);
  while(kf.children.length>5)kf.removeChild(kf.lastChild);
  setTimeout(()=>{if(d.parentNode)d.parentNode.removeChild(d);},4200);
}
function startReload(){
  const w=WEAPONS[player.cur];
  if(player.reloading>0||!player.alive||player.ammo[player.cur]>=w.mag)return;
  if(player.scoped){player.scoped=false;applyScope();}
  player.reloading=w.reload;
  $('reloadTip').style.display='block';
  sfxReload(w.reload); updateAmmoHUD();
}
function sfxStep(vol){
  if(!AC||muted||vol<=0.01)return;
  nzBurst(AC.currentTime,0.07,vol,'lowpass',400+Math.random()*350);

/* ================= 手雷：高爆 / 闪光 / 烟雾 ================= */
const nades=[];
const smokes=[];
const NADE_ORDER=['he','flash','smoke'];
const NADE_STYLE={he:{icon:'💣',name:'高爆雷'},flash:{icon:'⚡',name:'闪光弹'},smoke:{icon:'💨',name:'烟雾弹'}};
const sfxThrow=()=>{if(AC&&!muted)nzBurst(AC.currentTime,0.15,0.12,'bandpass',1200);};
function throwNade(){
  if(state!=='playing'||!player.alive||player.reloading>0)return;
  const type=NADE_ORDER.find(t=>player.nades[t]>0);
  if(!type){announce('没有手雷了');sfxEmpty();return;}
  player.nades[type]--;
  initAudio();
  const dir=new THREE.Vector3(); camera.getWorldDirection(dir);
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.09,8,8),
    new THREE.MeshStandardMaterial({color:type==='flash'?0xcccccc:0x2a4a2a,roughness:0.5,metalness:0.4}));
  m.position.copy(camera.position).addScaledVector(dir,0.6); m.position.y-=0.1;
  m.castShadow=true; scene.add(m);
  const vel=dir.clone().multiplyScalar(17); vel.y+=3.5;
  nades.push({m:m,vel:vel,type:type,t:0,fuse:type==='he'?1.6:(type==='flash'?1.4:1.1)});
  sfxThrow(); updateNadeHUD();
}
function updateNades(dt){
  for(let i=nades.length-1;i>=0;i--){
    const n=nades[i]; n.t+=dt;
    n.vel.y-=20*dt;
    n.m.position.addScaledVector(n.vel,dt);
    const p=n.m.position;
    if(p.y<0.09){p.y=0.09; n.vel.y*=-0.35; n.vel.x*=0.7; n.vel.z*=0.7;}
    collideCircle(p,0.12);
    // 敌人躲手雷：手雷落到脚边，敌人逃离炸点
    for(const b of bots){
      if(!b.enabled||!b.alive||b.dying||b.dodgeT>0)continue;
      if(Math.hypot(b.pos.x-p.x,b.pos.z-p.z)<5){b.dodgeT=1.1;b.fleeX=p.x;b.fleeZ=p.z;}
    }
    if(n.t>=n.fuse){detonateNade(n); nades.splice(i,1);}
  }
}
function detonateNade(n){
  const pos=n.m.position.clone(); scene.remove(n.m);
  if(n.type==='he')explodeHE(pos);
  else if(n.type==='flash')explodeFlash(pos);
  else explodeSmoke(pos);
}
function explodeHE(pos){
  spawnBurst(pos,0xffaa33,40,10,0.8); spawnBurst(pos,0xff5522,25,7,0.6); spawnBurst(pos,0x999999,15,4,1.0);
  boomLight.position.copy(pos); boomLight.position.y+=1; boomLight.intensity=90;
  makeNoise(pos.x,pos.z); // 爆炸声暴露位置
  if(AC&&!muted){const t=AC.currentTime; nzBurst(t,0.5,0.7,'lowpass',300); thumpSfx(t,45,0.6,0.8);}
  for(const b of bots){
    if(!b.alive||b.dying||!b.enabled)continue;
    const d=Math.hypot(b.pos.x-pos.x,b.pos.z-pos.z);
    if(d<10)damageBot(b,Math.max(12,135*(1-d/10)),new THREE.Vector3(b.pos.x,1.2,b.pos.z),false);
  }
  const pd=Math.hypot(player.pos.x-pos.x,player.pos.z-pos.z);
  if(pd<7&&player.alive)damagePlayer(60*(1-pd/7)*0.5,'手雷');
  player.shake=Math.min(1,player.shake+clamp(1-pd/12,0,1)*0.7);
  announce('💥 高爆雷！');
}
function explodeFlash(pos){
  spawnBurst(pos,0xffffff,25,6,0.4);
  if(AC&&!muted){const t=AC.currentTime; nzBurst(t,0.12,0.5,'highpass',4000); tone(2800,0.5,'sine',0.10,2600);}
  const eye=new THREE.Vector3(player.pos.x,EYE+player.y,player.pos.z);
  const toF=pos.clone().sub(eye); const dist=toF.length(); toF.normalize();
  const fwd=new THREE.Vector3(); camera.getWorldDirection(fwd);
  const facing=fwd.dot(toF);
  if(dist<28&&facing>0.25&&hasLOS(pos,eye))
    player.blindT=Math.max(player.blindT,(3.0*(1-dist/28)+0.5)*clamp((facing-0.25)/0.75,0.2,1));
  for(const b of bots){
    if(!b.alive||b.dying||!b.enabled)continue;
    _v1.set(b.pos.x-pos.x,0,b.pos.z-pos.z);
    if(_v1.length()<22){botEyePos(b,_v2); if(hasLOS(pos,_v2))b.blindT=2.2;}
  }
  announce('⚡ 闪光弹！');
}
let smokeTex=null;
function getSmokeTex(){
  if(smokeTex)return smokeTex;
  const c=document.createElement('canvas'); c.width=c.height=128;
  const x=c.getContext('2d');
  const gr=x.createRadialGradient(64,64,8,64,64,64);
  gr.addColorStop(0,'rgba(200,200,200,0.85)');
  gr.addColorStop(0.6,'rgba(180,180,180,0.45)');
  gr.addColorStop(1,'rgba(160,160,160,0)');
  x.fillStyle=gr; x.fillRect(0,0,128,128);
  smokeTex=new THREE.CanvasTexture(c);
  return smokeTex;
}
function explodeSmoke(pos){
  if(AC&&!muted)nzBurst(AC.currentTime,0.5,0.2,'lowpass',900);
  for(let i=0;i<10;i++){
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:getSmokeTex(),transparent:true,opacity:0,depthWrite:false}));
    const a=Math.random()*Math.PI*2, r=Math.random()*2.2;
    sp.position.set(pos.x+Math.cos(a)*r,0.8+Math.random()*1.6,pos.z+Math.sin(a)*r);
    const s=3+Math.random()*2; sp.scale.set(s,s,1);
    scene.add(sp);
    smokes.push({sp:sp,t:0,life:14,seed:Math.random()*10});
  }
  announce('💨 烟雾弹！');
}
const _sv1=new THREE.Vector3(),_sv2=new THREE.Vector3(),_sv3=new THREE.Vector3();
function smokeBlocked(a,b){
  for(const s of smokes){
    if(s.t<1||s.t>s.life-2)continue;
    const p=s.sp.position;
    _sv1.copy(b).sub(a); _sv2.copy(p).sub(a);
    const tt=clamp(_sv2.dot(_sv1)/Math.max(0.001,_sv1.lengthSq()),0,1);
    _sv3.copy(a).addScaledVector(_sv1,tt);
    if(_sv3.distanceTo(p)<2.0)return true;
  }
  return false;
}
function updateSmokes(dt){
  for(let i=smokes.length-1;i>=0;i--){
    const s=smokes[i]; s.t+=dt;
    s.sp.position.y+=dt*0.25;
    s.sp.position.x+=Math.sin(s.t*0.7+s.seed)*dt*0.3;
    const k=1-s.t/s.life;
    s.sp.material.opacity=0.8*Math.min(1,k*3)*Math.min(1,s.t*2);
    if(s.t>=s.life){scene.remove(s.sp); s.sp.material.dispose(); smokes.splice(i,1);}
  }
}

function buyItem(id){
  const it=BUY_ITEMS.find(x=>x.id===id);
  if(!it||player.money<it.price)return;
  if(it.kind==='gun'){
    if(player.owned[it.id])return;

/* ================= 个人战绩（按配置分组，localStorage 本地保存） ================= */
const REC_KEY='neonArenaRecordsV3';
function cfgKey(){return 'm'+gameCfg.mapIdx+'-e'+gameCfg.enemyIdx+'-d'+gameCfg.diffIdx+'-l'+gameCfg.lenIdx;}
function cfgName(){return MAPS[gameCfg.mapIdx].name+' · '+ENEMY_OPTS[gameCfg.enemyIdx]+'个敌人 · '+DIFFS[gameCfg.diffIdx].name+' · '+LEN_OPTS[gameCfg.lenIdx].t;}
function loadRecStore(){
  try{const r=JSON.parse(localStorage.getItem(REC_KEY)); if(r&&typeof r==='object')return r;}catch(e){}
  return {};
}
function blankRec(){return {matches:[],totals:{matches:0,kills:0,deaths:0,headshots:0,bestStreak:0,bestKills:0}};}
function loadRecords(){
  const store=loadRecStore(),k=cfgKey();
  if(!store[k])store[k]=blankRec();
  return store[k];
}
function saveMatch(){
  const store=loadRecStore(),k=cfgKey();
  const rec=store[k]||(store[k]=blankRec());
  const m={t:Date.now(),k:player.kills,d:player.deaths,hs:player.headshots,bs:player.bestStreak,s:player.score||0};
  rec.matches.unshift(m); rec.matches=rec.matches.slice(0,20);
  const t=rec.totals;
  t.matches++; t.kills+=m.k; t.deaths+=m.d; t.headshots+=m.hs;
  const newBest=m.k>t.bestKills&&m.k>0; t.bestKills=Math.max(t.bestKills,m.k);
  t.bestStreak=Math.max(t.bestStreak,m.bs);
  try{localStorage.setItem(REC_KEY,JSON.stringify(store));}catch(e){}
  return newBest;
}
function pad2(n){return (n<10?'0':'')+n;}
function renderRecords(){
  const rec=loadRecords(),t=rec.totals;
  const kd=t.deaths?(t.kills/t.deaths).toFixed(2):(''+t.kills);
  let h='<div id="recCfg">'+cfgName()+'</div>'
    +'<div class="recGrid">'
    +'<div>总场次<b>'+t.matches+'</b></div>'
    +'<div>总击杀<b>'+t.kills+'</b></div>'
    +'<div>K/D<b>'+kd+'</b></div>'
    +'<div>总爆头<b>'+t.headshots+'</b></div>'
    +'<div>单场最佳<b>'+t.bestKills+'</b></div>'
    +'<div>最高连杀<b>'+t.bestStreak+'</b></div>'
    +'</div>';
  if(rec.matches.length){
    h+='<button id="recToggle">最近战绩 ('+rec.matches.length+') ▸</button>'
      +'<div id="recList" style="display:none">'+rec.matches.map(m=>{
      const dt=new Date(m.t);
      const ds=(dt.getMonth()+1)+'/'+dt.getDate()+' '+pad2(dt.getHours())+':'+pad2(dt.getMinutes());
      return '<div class="recRow"><span>'+ds+'</span><span>'+m.k+'杀 / '+m.d+'死</span><span>'+m.hs+'爆头</span><span>连杀'+m.bs+'</span></div>';
    }).join('')+'</div><button id="recClear">清空本配置战绩</button>';
  }else{
    h+='<div id="recEmpty">这个配置还没有战绩，去打一场吧</div>';
  }
  $('recBody').innerHTML=h;
  const tg=$('recToggle');
  if(tg)tg.addEventListener('click',()=>{
    const l=$('recList');
    const open=l.style.display==='none';
    l.style.display=open?'block':'none';
    tg.textContent='最近战绩 ('+rec.matches.length+') '+(open?'▾':'▸');
  });
  const c=$('recClear');
  if(c)c.addEventListener('click',()=>{
    const s=loadRecStore(); delete s[cfgKey()];
    try{localStorage.setItem(REC_KEY,JSON.stringify(s));}catch(e){}
    renderRecords();
  });
}

/* ================= 玩家更新 ================= */
function updatePlayer(dt){
  if(!player.alive){
    player.respawnT-=dt;
    if(player.respawnT<=0){
      player.pos.copy(SPAWN); player.hp=100; player.alive=true; player.invuln=2;
      player.yaw=Math.PI; player.pitch=0; gun.visible=true;
      updateHpHUD(); announce('重返战场');
      spawnBurst(new THREE.Vector3(player.pos.x,1.2,player.pos.z),0x00ffff,16,5,0.5);
    }
    return;
  }
  if(player.invuln>0)player.invuln-=dt;
  // 移动
  let f=0,s=0;
  if(keys.KeyW||keys.ArrowUp)f+=1;
  if(keys.KeyS||keys.ArrowDown)f-=1;
  if(keys.KeyD||keys.ArrowRight)s+=1;
  if(keys.KeyA||keys.ArrowLeft)s-=1;
  if(keys.Space)doJump();
  f+=-joy.y; s+=joy.x;
  const len=Math.hypot(f,s);
  if(len>1){f/=len;s/=len;}
  player.moving=len>0.1; // 移动射击惩罚用
  const sp=8;
  const sy=Math.sin(player.yaw),cy=Math.cos(player.yaw);
  player.pos.x+=((-sy)*f+cy*s)*sp*dt;
  player.pos.z+=((-cy)*f+(-sy)*s)*sp*dt;
  collideCircle(player.pos,0.55);
  // 跳跃/重力
  if(!player.onGround||player.y>0){
    player.vy-=15*dt; player.y+=player.vy*dt;
    if(player.y<=0){player.y=0;player.vy=0;player.onGround=true;}
  }
  if(len>0.1&&player.onGround){
    player.bobT+=dt*9;
    player.stepT=(player.stepT||0)-dt;
    if(player.stepT<=0){player.stepT=0.36; sfxStep(0.07);} // 自己的脚步声
  }
  // 换弹
  if(player.reloading>0){
    player.reloading-=dt;
    if(player.reloading<=0){
      player.ammo[player.cur]=WEAPONS[player.cur].mag;
      $('reloadTip').style.display='none';
      updateAmmoHUD();
    }
  }
  player.fireCd-=dt;
  checkAutoTarget();
  tryFire();
  if(player.multiT>0){player.multiT-=dt;if(player.multiT<=0)player.multi=0;}
  // 相机
  const bob=player.onGround&&len>0.1?Math.sin(player.bobT)*0.035:0;
  player.shake=Math.max(0,player.shake-dt*3.2);
  const shx=(Math.random()-0.5)*player.shake*0.12,
        shy=(Math.random()-0.5)*player.shake*0.12;
  camera.position.set(player.pos.x+shx,EYE+player.y+bob+shy,player.pos.z);
  camera.rotation.y=player.yaw; camera.rotation.x=player.pitch;
  player.fovKick=Math.max(0,player.fovKick-dt*14);
  const fovT=(player.scoped?22:75)+player.fovKick;
  if(Math.abs(camera.fov-fovT)>0.05){camera.fov+=(fovT-camera.fov)*Math.min(1,dt*10);camera.updateProjectionMatrix();}
  player.bloom=Math.max(0,player.bloom-dt*40);
  $('cross').style.setProperty('--sp',(7+player.bloom*0.5)+'px');
  // 枪械动画：后座 / 切枪下沉 / 换弹倾斜 / 检视旋转
  gunKick=Math.max(0,gunKick-dt*0.9);
  gunDip=Math.max(0,gunDip-dt*3.5);
  if(inspectT>0)inspectT-=dt;
  gun.position.z=-0.55+gunKick;
  gun.position.y=-0.25-gunDip*0.16;
  gun.rotation.x=player.reloading>0?0.5:0;
  gun.rotation.y=inspectT>0?(0.8-inspectT)/0.8*Math.PI*2:0;
  gun.visible=!player.scoped&&(player.invuln<=0||Math.floor(elapsed*10)%2===0); // 无敌闪烁（开镜时隐藏枪）
  if(muzzleT>0){muzzleT-=dt;if(muzzleT<=0)muzzle.material.opacity=0;}
  // 计时
  elapsed+=dt;
  difficulty=clamp(elapsed/150,0,1);
  const left=Math.max(0,matchLen-elapsed);
  const mm=Math.floor(left/60),ss=Math.floor(left%60);
  $('timer').textContent=mm+':'+(ss<10?'0':'')+ss;
  $('timer').style.color=left<30?'#ff4455':'#0ff';
  if(left<=0)endGame();
}
/* ================= 主循环 ================= */
let lastT=0,menuAngle=0;
function loop(t){
  requestAnimationFrame(loop);
  const dt=clamp((t-lastT)/1000,0,0.05);
  lastT=t;
  if(state==='playing'){
    updatePlayer(dt);
    for(const b of bots)updateBot(b,dt);
    updatePickups(dt);
    updateOrbs(dt);
    updateNades(dt);
    updateSmokes(dt);
    if(player.blindT>0){player.blindT-=dt;$('flashWhite').style.opacity=clamp(player.blindT/2,0.15,1);}
    else $('flashWhite').style.opacity=0;
  }else if(state==='menu'){
    menuAngle+=dt*0.12;
    camera.position.set(Math.sin(menuAngle)*30,12,Math.cos(menuAngle)*30);
    camera.lookAt(0,1,0);
    for(const p of pickups){p.t+=dt;p.g.rotation.y+=dt*1.2;}
  }
  updateParticles(dt); updateSnow(dt);
  updateTracers(dt);
  updateDmgNums(dt);
  muzzleLight.intensity=Math.max(0,muzzleLight.intensity-dt*320);
  boomLight.intensity=Math.max(0,boomLight.intensity-dt*90);
  const pt=performance.now()*0.0022; // 中央竞技环呼吸脉冲
  for(const pm of pulseMats)pm.opacity=0.5+0.28*Math.sin(pt);
  renderer.render(scene,camera);
}
addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

applyScene(gameCfg.sceneIdx);
applyQuality(gameCfg.qIdx);
buildMap(gameCfg.mapIdx);
updateHpHUD(); updateAmmoHUD(); updateMoneyHUD(); updateNadeHUD();
renderRecords();
requestAnimationFrame(loop);
})();
